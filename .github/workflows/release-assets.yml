name: Release (Github Artifacts)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version"
        required: false
        default: ""

jobs:
  attach-assets:
    name: Attach assets to release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}

    steps:
      - uses: actions/checkout@v6
      - name: Determine version
        id: get-version
        run: |
          if [ -z "${{ github.event.inputs.version }}" ]; then
            echo "No version specified, using latest draft"
            echo "release=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')" >> "$GITHUB_OUTPUT"
          else
            echo "release=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Get build run
        id: get-build
        run: |
          if [ -z "${{ github.event.inputs.version }}" ]; then
            # Draft flow: the newest SUCCESSFUL main build ("completed" would
            # also match failed runs).
            build_id=$(gh run list -w 'Build .NET' --limit 1 --status success --branch main --json databaseId -q '.[].databaseId')
          else
            # Explicit version: the successful build of that tag's own commit,
            # so a release never gets whatever main has moved on to since.
            sha=$(gh api "/repos/${{ github.repository }}/commits/${{ steps.get-version.outputs.release }}" -q .sha)
            build_id=$(gh run list -w 'Build .NET' --limit 1 --status success --commit "$sha" --json databaseId -q '.[].databaseId')
          fi

          if [ -z "$build_id" ]; then
            echo "::error::No successful 'Build .NET' run found for ${{ steps.get-version.outputs.release }}"
            exit 1
          fi

          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        run: |
          artifacts=$(gh api /repos/${{ github.repository }}/actions/runs/${{ steps.get-build.outputs.build_id }}/artifacts | jq -c '.artifacts[]')

          # Create temporary directory for handling artifacts
          mkdir -p ${{ github.workspace }}/_artifacts && cd ${{ github.workspace }}/_artifacts

          for artifact in $artifacts; do
            name="$(echo $artifact | jq -r '.name').zip"
            url=$(echo $artifact | jq -r '.archive_download_url')

            echo "Downloading $name -> $url"

            gh api $url > $name
          done

      - name: Attach artifacts on release
        run: |
          gh release upload ${{ steps.get-version.outputs.release }} _artifacts/*.zip

      - name: Debug
        if: always()
        run: |
          echo "${{ steps.get-version.outputs.release }}"
          echo "${{ steps.get-build.outputs.build_id }}"
          ls -ls
          ls -ls _artifacts
